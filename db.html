<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FK Slovan Most — Databáza hráčov</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

/* ── PASSWORD GATE ── */
#gate {
  position: fixed; inset: 0; background: #1a1a2e; z-index: 1000;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
}
#gate .box { background: #fff; border-radius: 12px; padding: 32px 36px; width: 320px; text-align: center; }
#gate .logo { font-size: 22px; font-weight: 900; color: #4caf50; margin-bottom: 4px; }
#gate .sub { font-size: 12px; color: #888; margin-bottom: 20px; }
#gate input {
  width: 100%; padding: 10px 14px; border: 2px solid #ddd; border-radius: 8px;
  font-size: 14px; margin-bottom: 12px; outline: none;
}
#gate input:focus { border-color: #4caf50; }
#gate button {
  width: 100%; padding: 10px; border: none; border-radius: 8px;
  background: #4caf50; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
}
#gate button:hover { background: #43a047; }
#gate .err { color: #e74c3c; font-size: 12px; min-height: 16px; }

#app { display: none; }

header {
  background: #1a1a2e; color: #fff; padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.logo { font-size: 20px; font-weight: 900; color: #4caf50; }
.subtitle { font-size: 11px; color: #aaa; margin-top: 1px; }
.view-toggle { display: flex; gap: 6px; }
.view-btn {
  padding: 7px 16px; border-radius: 8px; border: 2px solid #333; background: #232338;
  color: #999; font-weight: 700; font-size: 13px; cursor: pointer;
}
.view-btn.active { background: #4caf50; border-color: #4caf50; color: #fff; }

.main { max-width: 1600px; margin: 0 auto; padding: 18px 20px; }

/* ── SUMMARY ── */
.summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.scard { background: #fff; border-radius: 10px; padding: 12px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-left: 4px solid var(--sc); min-width: 120px; flex: 1; }
.scard .num { font-size: 22px; font-weight: 900; color: var(--sc); line-height: 1; }
.scard .lbl { font-size: 11px; color: #888; margin-top: 2px; }

/* ── DB VIEW: FILTERS ── */
.filters { background: #fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fbtn { padding: 5px 11px; border-radius: 8px; border: 2px solid #ddd; background: #f5f5f5; font-size: 12px; cursor: pointer; font-weight: 600; }
.fbtn.active { border-color: var(--fc); background: #fff; color: var(--fc); }
.fbtn[data-f="all"] { --fc:#555; } .fbtn[data-f="aktívny"] { --fc:#27ae60; }
.fbtn[data-f="nový"] { --fc:#2980b9; } .fbtn[data-f="neaktívny"] { --fc:#888; }
.fbtn[data-f="dlznici"] { --fc:#c0392b; } .fbtn[data-f="neuplne"] { --fc:#e67e22; }
.search-input { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; width: 200px; }
.right-controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.editmode-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #555; cursor: pointer; }
.save-btn { padding: 7px 14px; border-radius: 8px; border: none; background: #4caf50; color: #fff; font-weight: 700; font-size: 12px; cursor: pointer; }
.save-btn:hover { background: #43a047; }
.save-btn.secondary { background: #2980b9; }
.save-btn.secondary:hover { background: #256a99; }

/* ── TABLE ── */
.table-wrap { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { padding: 8px 10px; text-align: left; font-size: 10.5px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 2px solid #f0f0f0; cursor: pointer; user-select: none; white-space: nowrap; position: sticky; top: 0; background: #fff; }
th:hover { color: #333; }
th.sorted::after { content: ' ↑'; } th.sorted.desc::after { content: ' ↓'; }
td { padding: 6px 10px; border-bottom: 1px solid #fafafa; white-space: nowrap; vertical-align: middle; }
tr:hover td { background: #f9f9f9; }
tr.neuplne td { background: #fff9e6; }
tr.neuplne:hover td { background: #fff3cc; }

.badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
.badge-aktívny { background: #d4edda; color: #155724; }
.badge-nový { background: #d0e8f7; color: #1a5276; }
.badge-neaktívny { background: #e8e8e8; color: #666; }
.badge-áno { background: #fde8e8; color: #c0392b; }
.badge-nie { background: #eafaf1; color: #1e8449; }
.badge-n\\/a { background: #f4f4f4; color: #999; }

.editable { cursor: text; border-radius: 4px; padding: 2px 4px; }
.editable:hover { background: #eef7ff; }
.editable:focus { outline: 2px solid #4caf50; background: #fff; }
.amt-red { color: #e74c3c; font-weight: 700; } .amt-green { color: #27ae60; font-weight: 700; } .amt-gray { color: #bbb; }

/* ── SIMULATOR VIEW ── */
#simview { display: none; }
.sim-controls { background: #fff; border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.team-toggle { display: flex; align-items: center; gap: 5px; background: #f5f5f5; border: 2px solid #ddd; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; font-weight: 700; }
.team-toggle input { display:none; }
.team-toggle.active { border-color: var(--tc); color: var(--tc); background: #fff; }
.t-u6{--tc:#8e44ad;}.t-u7{--tc:#2980b9;}.t-u8{--tc:#16a085;}.t-u9{--tc:#27ae60;}.t-u10{--tc:#f39c12;}
.t-u11{--tc:#e67e22;}.t-u12{--tc:#e74c3c;}.t-u13{--tc:#c0392b;}.t-u14{--tc:#922b21;}.t-u15{--tc:#6e2f1a;}
.t-u16{--tc:#4a235a;}.t-u17{--tc:#1a3a5c;}
.teams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.team-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-top: 4px solid var(--tc); }
.team-header { padding: 10px 14px 6px; display: flex; justify-content: space-between; }
.team-name { font-size: 18px; font-weight: 900; color: var(--tc); }
.team-count { font-size: 24px; font-weight: 900; color: var(--tc); }
.team-warn { padding: 5px 12px; font-size: 11px; background: #fff3cd; color: #856404; }
.team-warn.ok { background: #d4edda; color: #155724; }
.player-list { padding: 6px 0; max-height: 300px; overflow-y: auto; }
.player-row { display: flex; padding: 5px 14px; font-size: 12px; gap: 6px; }
.player-row:hover { background: #f9f9f9; }
.p-name { flex: 1; font-weight: 600; } .p-year { color: #999; font-size: 11px; }
.host-badge { font-size: 9.5px; background: #fff3cd; color: #856404; padding: 1px 5px; border-radius: 4px; }
.no-teams { text-align: center; padding: 40px; color: #aaa; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="logo">⚽ FK Slovan Most</div>
    <div class="sub">Databáza hráčov — vyžaduje heslo</div>
    <input type="password" id="pw-input" placeholder="Heslo" autofocus>
    <button onclick="unlock()">Odomknúť</button>
    <div class="err" id="pw-err"></div>
  </div>
</div>

<div id="app">
<header>
  <div>
    <div class="logo">⚽ FK Slovan Most pri Bratislave</div>
    <div class="subtitle">Konsolidovaná databáza hráčov — sezóna 2026/2027</div>
  </div>
  <div class="view-toggle">
    <button class="view-btn active" id="btn-db" onclick="switchView('db')">📋 Databáza</button>
    <button class="view-btn" id="btn-sim" onclick="switchView('sim')">🔄 Simulátor tímov</button>
  </div>
</header>

<div class="main">

  <!-- ══════════ DB VIEW ══════════ -->
  <div id="dbview">
    <div class="summary" id="summary"></div>

    <div class="filters">
      <button class="fbtn active" data-f="all" onclick="setFilter('all',this)">Všetci</button>
      <button class="fbtn" data-f="aktívny" onclick="setFilter('aktívny',this)">✅ Aktívni</button>
      <button class="fbtn" data-f="nový" onclick="setFilter('nový',this)">🆕 Noví</button>
      <button class="fbtn" data-f="neaktívny" onclick="setFilter('neaktívny',this)">⛔ Neaktívni</button>
      <button class="fbtn" data-f="dlznici" onclick="setFilter('dlznici',this)">💸 Dlžníci</button>
      <button class="fbtn" data-f="neuplne" onclick="setFilter('neuplne',this)">⚠️ Neúplné údaje</button>
      <input class="search-input" type="text" id="search-input" placeholder="🔍 Hľadať meno..." oninput="renderDB()">
      <div class="right-controls">
        <label class="editmode-toggle"><input type="checkbox" id="edit-toggle" onchange="toggleEditMode()"> ✏️ Editovať</label>
        <button class="save-btn" id="save-github-btn" onclick="saveToGitHub()" style="background:#27ae60;font-weight:800">☁️ Uložiť zmeny (live)</button>
        <button class="save-btn" onclick="saveLocal()" style="background:#888;font-size:11px" title="Len záložná kópia v tomto prehliadači, neodošle sa na GitHub">💾 Záloha (len tento prehliadač)</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th onclick="sortBy('meno')">Meno</th>
          <th onclick="sortBy('dob')">Dát. nar.</th>
          <th onclick="sortBy('tim_aktualny')">Tím (aktuálny)</th>
          <th onclick="sortBy('tim_podla_veku')">Tím (podľa veku)</th>
          <th onclick="sortBy('stav_hraca')">Stav</th>
          <th onclick="sortBy('predpis')">Predpis</th>
          <th onclick="sortBy('uhradene')">Uhradené</th>
          <th onclick="sortBy('zostatok')">Zostatok</th>
          <th onclick="sortBy('vymahat_dlh')">Vymáhať dlh?</th>
          <th onclick="sortBy('je_v_eos')">V EOS?</th>
          <th>Kontakt</th>
          <th onclick="sortBy('poznamka')">Poznámka</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ══════════ SIMULATOR VIEW ══════════ -->
  <div id="simview">
    <div class="sim-controls">
      <span style="font-weight:700;font-size:13px;color:#555">Tímy:</span>
      <label class="team-toggle t-u6"><input type="checkbox" onchange="renderSim()">U6</label>
      <label class="team-toggle t-u7"><input type="checkbox" onchange="renderSim()">U7</label>
      <label class="team-toggle t-u8"><input type="checkbox" onchange="renderSim()">U8</label>
      <label class="team-toggle t-u9"><input type="checkbox" checked onchange="renderSim()">U9</label>
      <label class="team-toggle t-u10"><input type="checkbox" checked onchange="renderSim()">U10</label>
      <label class="team-toggle t-u11"><input type="checkbox" onchange="renderSim()">U11</label>
      <label class="team-toggle t-u12"><input type="checkbox" onchange="renderSim()">U12</label>
      <label class="team-toggle t-u13"><input type="checkbox" checked onchange="renderSim()">U13</label>
      <label class="team-toggle t-u14"><input type="checkbox" onchange="renderSim()">U14</label>
      <label class="team-toggle t-u15"><input type="checkbox" checked onchange="renderSim()">U15</label>
      <label class="team-toggle t-u16"><input type="checkbox" onchange="renderSim()">U16</label>
      <label class="team-toggle t-u17"><input type="checkbox" checked onchange="renderSim()">U17</label>
      <label style="margin-left:auto;font-size:13px;display:flex;align-items:center;gap:6px"><input type="checkbox" id="sim-ostarenie" checked onchange="renderSim()">Ostaršenie</label>
    </div>
    <div id="sim-output"></div>
  </div>

</div>
</div>

let DATA = null;
let editMode = false;
let currentView = 'db';
let sortCol='meno', sortDesc=false, activeFilter='all';

function b64ToBuf(b64) { return Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); }
function bufToB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }

async function deriveKey(password, saltBuf, forEncrypt) {
  const enc = new TextEncoder();
  const passKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: saltBuf, iterations: 100000, hash:'SHA-256' },
    passKey, { name:'AES-GCM', length:256 }, false, [forEncrypt?'encrypt':'decrypt']
  );
}

let SESSION_PASSWORD = null;

async function unlock() {
  const pw = document.getElementById('pw-input').value;
  const err = document.getElementById('pw-err');
  err.textContent = '';
  try {
    const salt = b64ToBuf(ENC.salt);
    const iv = b64ToBuf(ENC.iv);
    const ct = b64ToBuf(ENC.ct);
    const key = await deriveKey(pw, salt, false);
    const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    const json = new TextDecoder().decode(plainBuf);
    DATA = JSON.parse(json);
    SESSION_PASSWORD = pw;

    // skus nacitat lokalne ulozene zmeny (ak existuju a su novsie)
    const local = localStorage.getItem('bfz_db_local');
    if (local) {
      try {
        const parsed = JSON.parse(local);
        if (confirm('Našli sa lokálne uložené zmeny z ' + parsed.savedAt + '. Načítať ich namiesto pôvodných dát?')) {
          DATA = parsed.data;
        }
      } catch(e){}
    }

    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderDB();
  } catch(e) {
    err.textContent = 'Nesprávne heslo';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });

function switchView(v) {
  currentView = v;
  document.getElementById('btn-db').classList.toggle('active', v==='db');
  document.getElementById('btn-sim').classList.toggle('active', v==='sim');
  document.getElementById('dbview').style.display = v==='db' ? 'block' : 'none';
  document.getElementById('simview').style.display = v==='sim' ? 'block' : 'none';
  if (v === 'sim') renderSim();
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderDB();
}
function sortBy(col) {
  if (sortCol===col) sortDesc=!sortDesc; else { sortCol=col; sortDesc=false; }
  renderDB();
}
function toggleEditMode() {
  editMode = document.getElementById('edit-toggle').checked;
  renderDB();
}

function fEur(v){ return (v==null||v==='')?'—':Number(v).toFixed(0)+' €'; }
function fmt(v){ return (v==null||v==='')?'—':v; }

function renderDB() {
  const search = document.getElementById('search-input').value.toLowerCase().trim();
  let rows = DATA.filter(r => {
    if (activeFilter==='dlznici') { if (!(Number(r.zostatok||0)>0 && r.vymahat_dlh==='áno')) return false; }
    else if (activeFilter==='neuplne') { if (!r.neuplne_udaje) return false; }
    else if (activeFilter!=='all' && r.stav_hraca!==activeFilter) return false;
    if (search && !r.meno.toLowerCase().includes(search)) return false;
    return true;
  });
  rows.sort((a,b)=>{
    let av=a[sortCol]??'', bv=b[sortCol]??'';
    if(!isNaN(av)&&av!==''){av=Number(av);bv=Number(bv);} else {av=String(av).toLowerCase();bv=String(bv).toLowerCase();}
    return sortDesc?(bv>av?1:-1):(av>bv?1:-1);
  });

  // Summary
  const total = DATA.length;
  const aktivni = DATA.filter(r=>r.stav_hraca==='aktívny').length;
  const novi = DATA.filter(r=>r.stav_hraca==='nový').length;
  const neaktivni = DATA.filter(r=>r.stav_hraca==='neaktívny').length;
  const dlznici = DATA.filter(r=>Number(r.zostatok||0)>0 && r.vymahat_dlh==='áno');
  const dlznaSuma = dlznici.reduce((s,r)=>s+Number(r.zostatok||0),0);
  document.getElementById('summary').innerHTML = `
    <div class="scard" style="--sc:#1a1a2e"><div class="num">${total}</div><div class="lbl">Celkom v databáze</div></div>
    <div class="scard" style="--sc:#27ae60"><div class="num">${aktivni}</div><div class="lbl">Aktívni</div></div>
    <div class="scard" style="--sc:#2980b9"><div class="num">${novi}</div><div class="lbl">Noví</div></div>
    <div class="scard" style="--sc:#888"><div class="num">${neaktivni}</div><div class="lbl">Neaktívni</div></div>
    <div class="scard" style="--sc:#c0392b"><div class="num">${dlznaSuma.toFixed(0)} €</div><div class="lbl">Dlžná suma (${dlznici.length} os.)</div></div>
    <div class="scard" style="--sc:#e67e22"><div class="num">${DATA.filter(r=>r.neuplne_udaje).length}</div><div class="lbl">Neúplné údaje</div></div>
  `;

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  rows.forEach((r, idx) => {
    const realIdx = DATA.indexOf(r);
    const tr = document.createElement('tr');
    tr.className = r.neuplne_udaje ? 'neuplne' : '';
    const ed = editMode;
    const editableAttr = (field, type='text') => ed ? `contenteditable="true" oninput="updateField(${realIdx},'${field}',this.innerText)"` : '';

    tr.innerHTML = `
      <td><strong ${editableAttr('meno')}>${r.meno}</strong></td>
      <td ${editableAttr('dob')}>${fmt(r.dob)}</td>
      <td ${editableAttr('tim_aktualny')}>${fmt(r.tim_aktualny)}</td>
      <td>${fmt(r.tim_podla_veku)}</td>
      <td>${ed ? `<select onchange="updateField(${realIdx},'stav_hraca',this.value)">
          ${['aktívny','nový','neaktívny'].map(s=>`<option value="${s}" ${r.stav_hraca===s?'selected':''}>${s}</option>`).join('')}
        </select>` : `<span class="badge badge-${r.stav_hraca}">${r.stav_hraca}</span>`}
      </td>
      <td ${editableAttr('predpis')}>${fEur(r.predpis)}</td>
      <td ${editableAttr('uhradene')}>${fEur(r.uhradene)}</td>
      <td ${editableAttr('zostatok')}><span class="${Number(r.zostatok||0)>0?'amt-red':'amt-green'}">${fEur(r.zostatok)}</span></td>
      <td>${ed ? `<select onchange="updateField(${realIdx},'vymahat_dlh',this.value)">
          ${['áno','nie','n/a'].map(s=>`<option value="${s}" ${r.vymahat_dlh===s?'selected':''}>${s}</option>`).join('')}
        </select>` : `<span class="badge badge-${r.vymahat_dlh.replace('/','\\/')}">${r.vymahat_dlh}</span>`}
      </td>
      <td>${ed ? `<select onchange="updateField(${realIdx},'je_v_eos',this.value==='true')">
          <option value="true" ${r.je_v_eos?'selected':''}>áno</option>
          <option value="false" ${!r.je_v_eos?'selected':''}>nie</option>
        </select>` : (r.je_v_eos ? '<span class="badge badge-nie" style="background:#eafaf1;color:#1e8449">✓ áno</span>' : '<span class="badge badge-áno">✗ nie</span>')}
      </td>
      <td style="font-size:11px">${r.email?'✉️':''}${r.telefon?' 📞':''}${!r.email&&!r.telefon?'<span class="amt-gray">—</span>':''}</td>
      <td ${editableAttr('poznamka')} style="white-space:normal;min-width:200px;max-width:300px">${fmt(r.poznamka)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function updateField(idx, field, value) {
  DATA[idx][field] = value;
}

function saveLocal() {
  localStorage.setItem('bfz_db_local', JSON.stringify({data: DATA, savedAt: new Date().toLocaleString('sk-SK')}));
  alert('Uložené len v tomto prehliadači (záloha). Toto NEODOŠLE zmeny na GitHub.');
}

const WORKER_URL = 'https://bfz-db-save.surko7.workers.dev/';

async function saveToGitHub() {
  const btn = document.getElementById('save-github-btn');
  const origText = btn.textContent;
  btn.textContent = '⏳ Ukladám...';
  btn.disabled = true;
  try {
    // Zasifruj aktualne DATA
    const enc = new TextEncoder();
    const jsonBytes = enc.encode(JSON.stringify(DATA));
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(SESSION_PASSWORD, salt, true);
    const ctBuf = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, jsonBytes);
    const newSalt = bufToB64(salt), newIv = bufToB64(iv), newCt = bufToB64(ctBuf);

    // Nacitaj aktualny HTML tejto stranky a nahrad ENC blok
    const resp = await fetch(location.href);

// ══════════ SIMULATOR LOGIC ══════════
const CATEGORIES = [
  {id:"U6",color:"#8e44ad",minYear:2021},{id:"U7",color:"#2980b9",minYear:2020},
  {id:"U8",color:"#16a085",minYear:2019},{id:"U9",color:"#27ae60",minYear:2018},
  {id:"U10",color:"#f39c12",minYear:2017},{id:"U11",color:"#e67e22",minYear:2016},
  {id:"U12",color:"#e74c3c",minYear:2015},{id:"U13",color:"#c0392b",minYear:2014},
  {id:"U14",color:"#922b21",minYear:2013},{id:"U15",color:"#6e2f1a",minYear:2012},
  {id:"U16",color:"#4a235a",minYear:2011},{id:"U17",color:"#1a3a5c",minYear:2010},
];
function naturalCatId(y, g) {
  const yy = g==='F' ? y+1 : y;
  for (const c of CATEGORIES) if (c.minYear <= yy) return c.id;
  return null;
}
function getYear(dob){ return parseInt(String(dob).split('-')[0]); }

function renderSim() {
  const activeTeams = CATEGORIES.filter(c => document.querySelector(`.t-${c.id.toLowerCase()} input`).checked);
  document.querySelectorAll('.team-toggle').forEach(el => {
    const cb = el.querySelector('input');
    el.classList.toggle('active', cb.checked);
  });
  const hosting = document.getElementById('sim-ostarenie').checked;
  const out = document.getElementById('sim-output');

  const players = DATA.filter(r => r.stav_hraca !== 'neaktívny' && r.dob);

  if (activeTeams.length === 0) {
    out.innerHTML = '<div class="no-teams">Zaškrtni aspoň jeden tím hore ☝️</div>';
    return;
  }

  function assign(p) {
    const y = getYear(p.dob);
    const natId = naturalCatId(y, p.pohlavie);
    if (!natId) return {team:null, type:'unassigned'};
    if (activeTeams.find(t=>t.id===natId)) return {team: CATEGORIES.find(c=>c.id===natId), type:'natural'};
    if (hosting) {
      const idx = CATEGORIES.findIndex(c=>c.id===natId);
      if (idx < CATEGORIES.length-1) {
        const up = CATEGORIES[idx+1];
        if (activeTeams.find(t=>t.id===up.id)) return {team: up, type:'host'};
      }
    }
    return {team:null, type:'unassigned'};
  }

  const assignments = players.map(p => ({p, ...assign(p)}));
  let html = '<div class="teams-grid">';
  for (const team of [...activeTeams].sort((a,b)=>a.minYear-b.minYear)) {
    const members = assignments.filter(a=>a.team && a.team.id===team.id);
    const cnt = members.length;
    const warnTxt = cnt<11 ? `⚠️ Iba ${cnt} — nestačí` : cnt<14 ? `⚠️ ${cnt} — tesne` : `✅ ${cnt} — OK`;
    html += `<div class="team-card t-${team.id.toLowerCase()}" style="--tc:${team.color}">
      <div class="team-header"><div class="team-name">${team.id}</div><div class="team-count">${cnt}</div></div>
      <div class="team-warn ${cnt>=14?'ok':''}">${warnTxt}</div>
      <div class="player-list">`;
    members.sort((a,b)=>a.p.meno.localeCompare(b.p.meno,'sk')).forEach(a => {
      const yr = getYear(a.p.dob);
      html += `<div class="player-row"><span class="p-name">${a.p.meno}</span>${a.type==='host'?`<span class="host-badge">host</span>`:''}<span class="p-year">${yr}</span></div>`;
    });
    html += `</div></div>`;
  }
  html += '</div>';
  out.innerHTML = html;
}
</script>
